<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Quick Summary</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        width: 320px;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      #status {
        font-size: 12px;
        color: #666;
        margin-bottom: 4px;
      }
      #summary {
        font-size: 14px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <button id="summarizeBtn">Summarize selection</button>
    <div id="status"></div>
    <div id="summary"></div>
    <script src="popup.js"></script>
  </body>
</html>
